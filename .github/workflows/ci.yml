name: ci

on:
  push:
    branches: [main, refoundation]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # pyproject declares requires-python = ">=3.11". Test the ENDS of that range, not one point in
      # the middle: the dev box runs 3.14 and the Dockerfile pins 3.12, so a 3.11-only gate was
      # asserting a floor nobody develops on while never exercising the version we actually ship on.
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Installs from pyproject.toml — the SAME declaration the project ships. CI used to install a
      # separate hand-typed list and never read requirements.txt, so the declared deps and the tested
      # deps had no way to drift-check each other.
      - name: Install (core + optional backends + bench + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[backends,bench,dev]"

      - name: Verify kernel present (no silent skip-to-green)
        # cli.py --selftest and several test files ADAPT to kernel presence (the full gate with the
        # kernel, a smaller pure-Python spine + wholesale skips without it). If cadquery ever failed
        # to import here, the gate would silently degrade and still pass. Fail hard instead.
        run: python -c "import cadquery, ifcopenshell; print('kernel present')"

      - name: Lint (dead-code gate)
        run: ruff check

      - name: Selftest gate (no LLM tokens)
        run: python cli.py --selftest

      - name: Eval pass-rate (reference builder)
        run: python cli.py --eval

      - name: Unit suite
        run: pytest
