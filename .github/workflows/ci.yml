name: ci

on:
  push:
    branches: [main, refoundation]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (core + kernel + test)
        run: |
          python -m pip install --upgrade pip
          pip install pytest PyYAML cadquery ifcopenshell ruff
      - name: Verify kernel present (no silent skip-to-green)
        # cli.py --selftest and 8 test files ADAPT to kernel presence (76/76 + full suite with the
        # kernel, 27/27 + wholesale skips without it). If cadquery ever failed to import here, the gate
        # would silently degrade to the pure-Python spine and still pass. Fail hard instead.
        run: python -c "import cadquery, ifcopenshell; print('kernel present')"
      - name: Lint (dead-code gate)
        run: ruff check
      - name: Selftest gate (no LLM tokens)
        run: python cli.py --selftest
      - name: Eval pass-rate (reference builder)
        run: python cli.py --eval
      - name: Unit suite
        run: pytest -q
