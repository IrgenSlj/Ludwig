name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ludwig
          POSTGRES_PASSWORD: ludwig
          POSTGRES_DB: ludwig_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ludwig" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
      - name: Lint
        run: ruff check
      - name: Test (SQLite)
        run: pytest
      - name: Test the service on Postgres
        env:
          LUDWIG_TEST_DATABASE_URL: postgresql+psycopg://ludwig:ludwig@localhost:5432/ludwig_test
        run: pytest tests/test_api.py
