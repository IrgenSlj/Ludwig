[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ludwig"
version = "0.1.0.dev0"
description = "Pre-production check for building-component fabricators."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ezdxf>=1.3",
    "ifcopenshell>=0.8",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pypdf>=5",
    "PyYAML>=6.0",
]

[project.scripts]
ludwig = "ludwig.cli:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ludwig = ["**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
