# Ludwig — one source of truth for dependencies, the supported Python range, and tool config.
#
# Before this file there were three: requirements.txt declared the runtime deps, `.github/workflows/ci.yml`
# installed a DIFFERENT hand-typed list (and never read requirements.txt, so the two could not drift-check
# each other), and neither declared pytest or ruff even though CI ran both. The supported Python range was
# stated nowhere and implied in three places at once — CI pinned 3.11, the Dockerfile pins 3.12, the dev box
# runs 3.14.
#
# Dependency posture is unchanged and still the locked one (BRIEF §4 / CLAUDE.md): the CORE is
# dependency-light, heavy kernels are imported LAZILY inside the modules that need them, and the optional
# extras below stay optional. `--selftest` must keep passing with only `core` installed.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ludwig"
version = "0.1.0"
description = "AI-native precision design — a compiler from natural language to verified, fabricable CAD/BIM."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

# The core runtime. cadquery is the locked OCCT kernel (BRIEF §4) and ifcopenshell the IFC backend;
# both are imported lazily, so the spine stays importable before they land.
dependencies = [
    "PyYAML>=6.0",          # standards.yaml loader
    "cadquery>=2.8",        # OCCT exact B-rep geometry service (the locked kernel)
    "ifcopenshell>=0.8",    # IFC (BIM) authoring
]

[project.optional-dependencies]
# Derived backends that are NOT on the spine gate — a missing one degrades that projection, never the loop.
backends = [
    "ezdxf>=1.1",           # DXF/SVG drawing writer (HLR -> DXF)
    "matplotlib>=3.7",      # shop-drawing + section PNG previews (best-effort)
]
mcp = ["mcp>=1.2"]          # `cli.py mcp` — the MCP server (A2). Imported lazily in agent/mcp.py.
bench = ["pyarrow>=15"]     # reads the BenchCAD parquet for `--eval --bench edit`. Dev-only path.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
ludwig = "cli:main_entry"

[project.urls]
Homepage = "https://github.com/IrgenSlj/Ludwig"

[tool.setuptools]
# Flat layout: the IR, the geometry service, the backends and the critic are top-level packages, and
# cli.py is a top-level module. Listed explicitly rather than auto-discovered so `docs/`, `prompts/`,
# `examples/` and `tests/` are never mistaken for shipped packages.
packages = [
    "agent", "backends", "critic", "eval", "geometry",
    "ir", "store", "telemetry", "toolkit", "webapp",
]
py-modules = ["cli"]

[tool.setuptools.package-data]
webapp = ["*.html", "vendor/*"]

# --------------------------------------------------------------------------- #
# tooling (was ruff.toml — consolidated so config lives in one file)
# --------------------------------------------------------------------------- #

[tool.ruff]
# Scope: the dead-code gate (pyflakes F-rules) — unused imports/vars, undefined names, redefinitions.
# Style/formatting is intentionally NOT enforced (low churn).
line-length = 120
extend-exclude = [".venv", "prototype", "out", "renders", "runs", "data"]

[tool.ruff.lint]
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quiet the noise but keep failures loud. `conftest.py` at the repo root puts it on sys.path.
addopts = "-q"
