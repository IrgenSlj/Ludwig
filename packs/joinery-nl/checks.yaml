# The architect's own documents against each other: model, schedule, drawing
# (docs/ERROR_CANDIDATES.md 15-17). Catchable from the architect set alone.

- id: drawings-count
  kind: consistent
  applies_to: {side: architect, type: frame}
  group_by: mark
  field: quantity
  severity: warning
  message: "Frame {mark}: count differs between the architect's documents ({measured})"

- id: drawings-width
  kind: consistent
  applies_to: {side: architect, type: frame}
  when: is_set(width_mm)
  group_by: mark
  field: width_mm
  tolerance: limits.reconcile.width_tolerance_mm
  severity: warning
  message: "Frame {mark}: width differs between the architect's documents ({measured})"

- id: drawings-height
  kind: consistent
  applies_to: {side: architect, type: frame}
  when: is_set(height_mm)
  group_by: mark
  field: height_mm
  tolerance: limits.reconcile.height_tolerance_mm
  severity: warning
  message: "Frame {mark}: height differs between the architect's documents ({measured})"

- id: drawings-opening-direction
  kind: consistent
  applies_to: {side: architect, type: frame}
  when: is_set(props.opening_direction)
  group_by: mark
  field: props.opening_direction
  severity: warning
  message: "Frame {mark}: opening direction differs between the architect's documents ({measured})"

- id: drawings-glazing-type
  kind: consistent
  applies_to: {side: architect, type: frame}
  when: is_set(props.glazing_type)
  group_by: mark
  field: props.glazing_type
  severity: warning
  message: "Frame {mark}: glazing differs between the architect's documents ({measured})"

- id: drawings-fire-rating
  kind: consistent
  applies_to: {side: architect, type: frame}
  when: is_set(props.fire_rating_min) and props.fire_rating_min > 0
  group_by: mark
  field: props.fire_rating_min
  severity: blocker
  message: "Frame {mark}: fire rating differs between the architect's documents ({measured})"
